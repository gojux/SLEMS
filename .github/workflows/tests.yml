name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same container as locally: Home Assistant image with pytest.
      - run: docker compose --profile tests run --rm tests

  e2e:
    name: setup (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A fresh Home Assistant with simulators, set up through the frontend API (dev/e2e).
      - run: docker compose -f dev/e2e/docker-compose.yml run --rm e2e
      - name: Home Assistant log
        if: failure()
        run: docker compose -f dev/e2e/docker-compose.yml logs --no-color homeassistant | tail -300
      - if: always()
        run: docker compose -f dev/e2e/docker-compose.yml down
