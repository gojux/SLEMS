name: slems

x-venus-sim: &venus-sim
  image: python:3.13-alpine
  command: ["python", "/sim/simulator.py"]
  volumes:
    - ./dev/venus_sim:/sim:ro
  restart: unless-stopped

services:
  homeassistant:
    # Keep in sync with the Home Assistant version used in production.
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    ports:
      - "8123:8123"
    volumes:
      - ./dev/config:/config
      - ./custom_components/slems:/config/custom_components/slems:ro
      # PV forecast provider without internet (dev/sim_solar_forecast).
      - ./dev/sim_solar_forecast:/config/custom_components/sim_solar_forecast:ro
    environment:
      TZ: Europe/Vienna
      # Offers the Venus profile for batteries from a Modbus profile (DEV_ONLY_PROFILES).
      SLEMS_DEV_PROFILES: "1"
    depends_on:
      - venus-sim-1
      - venus-sim-2
      - venus-sim-3
      - venus-sim-4
      - sunspec-meter
      - huawei-sim
    restart: unless-stopped

  # Two simulated Marstek Venus E 3.0 batteries (host names venus-sim-1/2, port 502).
  venus-sim-1:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "40"

  venus-sim-2:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "75"

  # Controlled through Home Assistant entities (Modbus and template entities in
  # dev/config/configuration.yaml), like a battery behind another integration.
  venus-sim-3:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "55"

  # Controlled through the Venus profile (battery from a Modbus profile), to
  # compare it with the direct driver of venus-sim-1/2.
  venus-sim-4:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "60"

  # Simulated Huawei SUN2000-8K-MAP0 hybrid inverter with LUNA2000-14-S1
  # (host huawei-sim, port 502, unit ID 1), for batteries from a Modbus profile
  # with own PV; Home Assistant feeds PV and grid power through port 5021.
  huawei-sim:
    image: python:3.13-alpine
    command: ["python", "/sim/simulator.py"]
    volumes:
      - ./dev/huawei_sim:/sim:ro
    environment:
      SIM_INITIAL_SOC: "50"
    restart: unless-stopped

  # SunSpec meter like at a SolarEdge inverter (host sunspec-meter, port 502),
  # fed with the simulated grid power by Home Assistant through port 5021.
  sunspec-meter:
    image: python:3.13-alpine
    command: ["python", "/sim/meter_sim.py"]
    volumes:
      - ./dev/sunspec_meter:/sim:ro
    restart: unless-stopped

  # evcc for the wallbox guide (docs/wallbox-evcc.md), configured in its web UI
  # on http://localhost:7070; its data stays in dev/evcc (not committed). Host
  # network, so evcc and the browser both reach Home Assistant on
  # localhost:8123. Start with: docker compose --profile evcc up -d evcc
  evcc:
    image: evcc/evcc:0.316.1
    profiles: ["evcc"]
    network_mode: host
    volumes:
      - ./dev/evcc:/root/.evcc
    restart: unless-stopped

  # Test runner using the same Python and Home Assistant version as production.
  # Usage: docker compose run --rm tests
  tests:
    build:
      context: dev
      dockerfile: tests.Dockerfile
    working_dir: /repo
    volumes:
      - .:/repo
    # The container runs as root: no bytecode or pytest cache in the repository.
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["python", "-m", "pytest", "-p", "no:cacheprovider"]
    profiles: ["tests"]
