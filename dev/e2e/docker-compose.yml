# End-to-end test of the setup: a fresh Home Assistant (configuration in
# memory) with the development configuration and its own simulators, the
# integration set up through the same API as the frontend (run.py). A project
# of its own, so a running development instance is not touched.
#
# Usage (from the repository root):
#   docker compose -f dev/e2e/docker-compose.yml run --rm e2e
#   docker compose -f dev/e2e/docker-compose.yml down
# HA_VERSION selects another Home Assistant version, e.g. the minimum one:
#   HA_VERSION=$(jq -r .homeassistant hacs.json) docker compose -f dev/e2e/docker-compose.yml run --rm e2e
name: slems-e2e

x-venus-sim: &venus-sim
  image: python:3.13-alpine
  command: ["python", "/sim/simulator.py"]
  volumes:
    - ../venus_sim:/sim:ro

services:
  homeassistant:
    # By default the same version as the development instance.
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-2026.10.1}
    tmpfs:
      - /config
    volumes:
      - ../config/configuration.yaml:/config/configuration.yaml:ro
      - ../../custom_components/slems:/config/custom_components/slems:ro
      - ../sim_solar_forecast:/config/custom_components/sim_solar_forecast:ro
    environment:
      TZ: Europe/Vienna
      # Offers the Venus profile for batteries from a Modbus profile (DEV_ONLY_PROFILES).
      SLEMS_DEV_PROFILES: "1"
    depends_on:
      - venus-sim-1
      - venus-sim-2
      - venus-sim-3
      - venus-sim-4
      - venus-sim-5
      - sunspec-meter

  venus-sim-1:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "40"

  venus-sim-2:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "75"

  venus-sim-3:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "55"

  # Controlled through the Venus profile (battery from a Modbus profile), to
  # compare it with the direct driver of venus-sim-1/2.
  venus-sim-4:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "60"

  # Only here, outside the smart meter loop: a battery from an own profile (a
  # copy of the Venus profile), set up until its trial waits.
  venus-sim-5:
    <<: *venus-sim
    environment:
      SIM_INITIAL_SOC: "45"

  sunspec-meter:
    image: python:3.13-alpine
    command: ["python", "/sim/meter_sim.py"]
    volumes:
      - ../sunspec_meter:/sim:ro

  e2e:
    image: python:3.13-alpine
    command: ["python", "-u", "/e2e/run.py"]
    volumes:
      - .:/e2e:ro
      - ../../custom_components/slems/templates/battery_profiles:/profiles:ro
    environment:
      HA_URL: http://homeassistant:8123
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - homeassistant
