# Development configuration for SLEMS.
homeassistant:
  time_zone: Europe/Vienna

default_config:

logger:
  default: info
  logs:
    custom_components.slems: debug
    homeassistant.components.automation.feed_simulated_sunspec_meter: warning
    homeassistant.components.automation.simulate_plug_in_battery_charge: warning

# Simulated measurements. Adjust the sliders to play with the values.
input_number:
  sim_house_load:
    name: Simulated house load
    min: 0
    max: 10000
    step: 50
    unit_of_measurement: W
    initial: 600
  sim_pv_power:
    name: Simulated PV power
    min: 0
    max: 10000
    step: 50
    unit_of_measurement: W
    initial: 1500
  sim_heat_pump_power:
    name: Simulated heat pump power
    min: 0
    max: 5000
    step: 50
    unit_of_measurement: W
    initial: 800
  # Power set point of the heating rod, controlled by SLEMS.
  sim_heating_rod_setpoint:
    name: Heating rod set point
    min: 0
    max: 3000
    step: 100
    unit_of_measurement: W
    initial: 0

  # Simulated wallbox, controlled by SLEMS through its current (A).
  sim_wallbox_current:
    name: Wallbox charging current
    min: 0
    max: 16
    step: 1
    unit_of_measurement: A
    initial: 6
  sim_wallbox_phases:
    name: Wallbox active phases
    min: 1
    max: 3
    step: 1
    initial: 3

  # Simulated plug-in battery with its own PV modules (2.24 kWh, 800 W
  # output, 1200 W input from the grid), SLEMS battery type "Home Assistant
  # entities" with "Own PV modules at the battery" and control "Output".
  # Shift of the simulated solar forecasts (dev/sim_solar_forecast) in hours.
  sim_solar_forecast_shift:
    name: Simulated solar forecast shift
    min: -12
    max: 12
    step: 1
    unit_of_measurement: h
    initial: 0
  sim_plug_in_pv:
    name: Simulated plug-in battery PV power
    min: 0
    max: 1000
    step: 10
    unit_of_measurement: W
    initial: 400
  sim_plug_in_soc:
    name: Plug-in battery state of charge
    min: 0
    max: 100
    step: 0.0001
    unit_of_measurement: "%"
    initial: 50
  sim_plug_in_output_setpoint:
    name: Plug-in battery output set point
    min: 0
    max: 800
    step: 1
    unit_of_measurement: W
    initial: 0
  sim_plug_in_input_setpoint:
    name: Plug-in battery input set point
    min: 0
    max: 1200
    step: 1
    unit_of_measurement: W
    initial: 0

input_select:
  # Mode of the simulated plug-in battery (like acMode of Zendure).
  sim_plug_in_ac_mode:
    name: Plug-in battery AC mode
    options: [Input, Output]
    initial: Output

input_boolean:
  sim_plug_in_passes_through:
    name: Plug-in battery passes its PV through when full
    initial: false
  sim_heating_rod_blocked:
    name: Heating rod externally blocked
  # Start/stop of the simulated wallbox (SLEMS) and whether a car is plugged in.
  sim_wallbox_enabled:
    name: Wallbox charging enabled
  sim_car_connected:
    name: Car connected
    initial: true

template:
  # Closed loop: the grid power results from load, PV and the AC power of the
  # simulated batteries (+discharge, read every second from their read-only
  # tap port), so SLEMS sees the effect of its own commands. Updated every
  # second like a fast real meter.
  - trigger:
      - trigger: time_pattern
        seconds: "/1"
    sensor:
      - name: Smart meter power
        unique_id: sim_smart_meter_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {{ (states('input_number.sim_house_load') | float(0)
              + states('sensor.heat_pump_power') | float(0)
              + states('sensor.heating_rod_power') | float(0)
              + states('sensor.wallbox_power') | float(0)
              - states('input_number.sim_pv_power') | float(0)
              - states('sensor.sim_venus_1_ac_power') | float(0)
              - states('sensor.sim_venus_2_ac_power') | float(0)
              - states('sensor.sim_venus_3_ac_power') | float(0)
              - states('sensor.sim_venus_4_ac_power') | float(0)
              - states('sensor.plug_in_battery_output') | float(0)
              + states('sensor.plug_in_battery_input') | float(0)) | round(0) }}
  # Plug-in battery with own PV: in mode Output the output follows its set
  # point, in mode Input the input charges from the grid. Empty it gives at
  # most its PV; full it passes the PV through, or with the switch off it
  # curtails the modules to the output.
  - number:
      - name: Plug-in battery output limit
        unique_id: sim_plug_in_output_limit
        unit_of_measurement: W
        min: 0
        max: 800
        step: 1
        state: "{{ states('input_number.sim_plug_in_output_setpoint') | float(0) }}"
        set_value:
          - action: input_number.set_value
            target: {entity_id: input_number.sim_plug_in_output_setpoint}
            data: {value: "{{ value }}"}
      - name: Plug-in battery input limit
        unique_id: sim_plug_in_input_limit
        unit_of_measurement: W
        min: 0
        max: 1200
        step: 1
        state: "{{ states('input_number.sim_plug_in_input_setpoint') | float(0) }}"
        set_value:
          - action: input_number.set_value
            target: {entity_id: input_number.sim_plug_in_input_setpoint}
            data: {value: "{{ value }}"}
    sensor:
      - name: Plug-in battery PV power
        unique_id: sim_plug_in_pv_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set pv = states('input_number.sim_plug_in_pv') | float(0) %}
          {% set out = states('sensor.plug_in_battery_output') | float(0) %}
          {% set full = states('input_number.sim_plug_in_soc') | float(0) >= 100 %}
          {{ ([pv, out] | min if full else pv) | round(0) }}
      - name: Plug-in battery output
        unique_id: sim_plug_in_output
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set pv = states('input_number.sim_plug_in_pv') | float(0) %}
          {% set soc = states('input_number.sim_plug_in_soc') | float(0) %}
          {% set out = [[states('input_number.sim_plug_in_output_setpoint') | float(0), 0] | max, 800] | min %}
          {% if is_state('input_select.sim_plug_in_ac_mode', 'Input') %}{% set out = 0 %}{% endif %}
          {% if soc <= 0 %}{% set out = [out, pv] | min %}{% endif %}
          {% if soc >= 100 and is_state('input_boolean.sim_plug_in_passes_through', 'on') %}
            {% set out = [out, [pv, 800] | min] | max %}
          {% endif %}
          {{ out | round(0) }}
      - name: Plug-in battery input
        unique_id: sim_plug_in_input
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set full = states('input_number.sim_plug_in_soc') | float(0) >= 100 %}
          {% set input = [[states('input_number.sim_plug_in_input_setpoint') | float(0), 0] | max, 1200] | min %}
          {{ (input if is_state('input_select.sim_plug_in_ac_mode', 'Input') and not full else 0) | round(0) }}
      - name: Plug-in battery state of charge
        unique_id: sim_plug_in_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: "{{ states('input_number.sim_plug_in_soc') | float(0) | round(1) }}"
  # Third simulated Venus, controlled through entities (SLEMS battery type
  # "Home Assistant entities", control "separate charge and discharge power").
  - number:
      - name: Venus 3 charge power
        unique_id: sim_venus_3_charge_power
        unit_of_measurement: W
        min: 0
        max: 2500
        step: 1
        state: "{{ states('sensor.venus_3_set_charge_power') | float(0) }}"
        set_value:
          - action: modbus.write_register
            data: {hub: venus_sim_3, slave: 1, address: 42020, value: "{{ value | int }}"}
      - name: Venus 3 discharge power
        unique_id: sim_venus_3_discharge_power
        unit_of_measurement: W
        min: 0
        max: 2500
        step: 1
        state: "{{ states('sensor.venus_3_set_discharge_power') | float(0) }}"
        set_value:
          - action: modbus.write_register
            data: {hub: venus_sim_3, slave: 1, address: 42021, value: "{{ value | int }}"}
    select:
      - name: Venus 3 force mode
        unique_id: sim_venus_3_force_mode
        options: "{{ ['Stop', 'Charge', 'Discharge'] }}"
        state: "{{ ['Stop', 'Charge', 'Discharge'][states('sensor.venus_3_force_mode_raw') | int(0)] }}"
        select_option:
          - action: modbus.write_register
            data:
              hub: venus_sim_3
              slave: 1
              address: 42010
              value: "{{ ['Stop', 'Charge', 'Discharge'].index(option) }}"
  - sensor:
      - name: Wallbox power
        unique_id: sim_wallbox_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {{ (states('input_number.sim_wallbox_current') | float(0) * 230
              * states('input_number.sim_wallbox_phases') | float(0))
             if is_state('input_boolean.sim_wallbox_enabled', 'on')
                and is_state('input_boolean.sim_car_connected', 'on') else 0 }}
      - name: PV power
        unique_id: sim_pv_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ states('input_number.sim_pv_power') | float(0) }}"
      - name: Heat pump power
        unique_id: sim_heat_pump_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ states('input_number.sim_heat_pump_power') | float(0) }}"
      - name: Heating rod power
        unique_id: sim_heating_rod_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {{ 0 if is_state('input_boolean.sim_heating_rod_blocked', 'on')
             else states('input_number.sim_heating_rod_setpoint') | float(0) }}

sensor:
  - platform: integration
    source: sensor.heat_pump_power
    name: Heat pump energy
    unique_id: sim_heat_pump_energy
    unit_prefix: k
    method: left
  - platform: integration
    source: sensor.wallbox_power
    name: Wallbox energy
    unique_id: sim_wallbox_energy
    unit_prefix: k
    method: left
  - platform: integration
    source: sensor.heating_rod_power
    name: Heating rod energy
    unique_id: sim_heating_rod_energy
    unit_prefix: k
    method: left

# Read-only access to the simulated batteries for the closed-loop meter.
modbus:
  - name: venus_sim_1_tap
    type: tcp
    host: venus-sim-1
    port: 5020
    sensors:
      - name: Sim Venus 1 AC power
        unique_id: sim_venus_1_ac_power
        device_address: 1
        address: 30006
        input_type: holding
        data_type: int16
        unit_of_measurement: W
        device_class: power
        scan_interval: 1
  - name: venus_sim_2_tap
    type: tcp
    host: venus-sim-2
    port: 5020
    sensors:
      - name: Sim Venus 2 AC power
        unique_id: sim_venus_2_ac_power
        device_address: 1
        address: 30006
        input_type: holding
        data_type: int16
        unit_of_measurement: W
        device_class: power
        scan_interval: 1
  - name: venus_sim_4_tap
    type: tcp
    host: venus-sim-4
    port: 5020
    sensors:
      - name: Sim Venus 4 AC power
        unique_id: sim_venus_4_ac_power
        device_address: 1
        address: 30006
        input_type: holding
        data_type: int16
        unit_of_measurement: W
        device_class: power
        scan_interval: 1
  # Feed port of the simulated SunSpec meter (see the automation below).
  - name: sunspec_meter_feed
    type: tcp
    host: sunspec-meter
    port: 5021
    sensors:
      - name: Sim SunSpec meter power
        unique_id: sim_sunspec_meter_power
        device_address: 1
        address: 40206
        input_type: holding
        data_type: int16
        unit_of_measurement: W
        device_class: power
        scan_interval: 5
  # Control port of the third simulated Venus (see the template entities above).
  - name: venus_sim_3
    type: tcp
    host: venus-sim-3
    port: 502
    sensors:
      - name: Venus 3 state of charge
        unique_id: sim_venus_3_soc
        device_address: 1
        address: 34002
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "%"
        device_class: battery
        scan_interval: 2
      - name: Venus 3 AC power
        unique_id: sim_venus_3_battery_power
        device_address: 1
        address: 30006
        input_type: holding
        data_type: int16
        unit_of_measurement: W
        device_class: power
        scan_interval: 1
      - name: Venus 3 set charge power
        unique_id: sim_venus_3_set_charge_power
        device_address: 1
        address: 42020
        input_type: holding
        data_type: uint16
        scan_interval: 2
      - name: Venus 3 set discharge power
        unique_id: sim_venus_3_set_discharge_power
        device_address: 1
        address: 42021
        input_type: holding
        data_type: uint16
        scan_interval: 2
      - name: Venus 3 force mode raw
        unique_id: sim_venus_3_force_mode_raw
        device_address: 1
        address: 42010
        input_type: holding
        data_type: uint16
        scan_interval: 2
    switches:
      - name: Venus 3 RS485 control
        unique_id: sim_venus_3_rs485_control
        device_address: 1
        address: 42000
        write_type: holding
        command_on: 0x55AA
        command_off: 0x55BB
        verify:
          input_type: holding
          address: 42000
          state_on: 0x55AA
          state_off: 0x55BB
  - name: venus_sim_3_tap
    type: tcp
    host: venus-sim-3
    port: 5020
    sensors:
      - name: Sim Venus 3 AC power
        unique_id: sim_venus_3_ac_power
        device_address: 1
        address: 30006
        input_type: holding
        data_type: int16
        unit_of_measurement: W
        device_class: power
        scan_interval: 1

# Feeds the simulated SunSpec meter (dev/sunspec_meter) with the grid power,
# export positive like SolarEdge, for "read the smart meter over Modbus".
automation sim:
  - alias: Simulate plug-in battery charge
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/1"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.sim_plug_in_soc}
        data:
          value: >-
            {% set power = states('sensor.plug_in_battery_pv_power') | float(0)
                + states('sensor.plug_in_battery_input') | float(0)
                - states('sensor.plug_in_battery_output') | float(0) %}
            {{ [[states('input_number.sim_plug_in_soc') | float(0) + power / 3600 / 2240 * 100, 0] | max, 100] | min | round(4) }}
  - alias: Feed simulated SunSpec meter
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.smart_meter_power
    actions:
      - action: modbus.write_register
        data:
          hub: sunspec_meter_feed
          slave: 1
          address: 40206
          value: "{{ ((trigger.to_state.state | float(0) * -1) | int) % 65536 }}"
